<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قريب - رادار التعارف | Qareeb Companion</title>
    <meta name="description" content="تطبيق قريب - رادار التعارف والتواصل الذكي بالذكاء الاصطناعي">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF3B70;
            --primary-dark: #D92556;
            --bg: #0D0F17;
            --card-bg: #161A26;
            --text: #F1F3F9;
            --text-muted: #8E98B0;
            --border: #23293D;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .logo {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #FF3B70 0%, #FFA26B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }
        .link-btn {
            display: block;
            background: rgba(255, 59, 112, 0.1);
            color: #FF7096;
            border: 1px solid rgba(255, 59, 112, 0.3);
            padding: 14px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        .link-btn:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 59, 112, 0.35);
        }
        .footer {
            border-top: 1px solid var(--border);
            padding-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .footer a {
            color: #FF7096;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📡💖</div>
        <h1>قريب - رادار التعارف</h1>
        <p class="subtitle">تطبيق التواصل الذكي بالرادار والذكاء الاصطناعي في منطقة الشرق الأوسط وشمال أفريقيا</p>
        
        <div class="links">
            <a href="https://oussamadouaghri.github.io/qareeb-privacy/" class="link-btn">🔒 سياسة الخصوصية (Privacy Policy)</a>
            <a href="https://oussamadouaghri.github.io/app-ads.txt" class="link-btn">📄 app-ads.txt (Authorized Digital Sellers)</a>
        </div>

        <div class="footer">
            <p>جميع الحقوق محفوظة &copy; 2026 Qareeb Radar Companion</p>
            <p style="margin-top: 6px;">Developer Contact: <a href="mailto:support@epartpal.com">support@epartpal.com</a></p>
        </div>
    </div>
</body>
</html>
